services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-options_data}
      POSTGRES_USER: ${POSTGRES_USER:-options_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-options_user} -d ${POSTGRES_DB:-options_data}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # No resource limits set — see "Task 10: resource limits" in README.md
    # for why (personal-project scale, and a hard cap on Postgres risks a
    # crash-loop instead of graceful degradation). Uncomment and size to
    # your hardware if you want a ceiling:
    # mem_limit: 2g
    # cpus: 2.0

  # One-shot: applies Alembic migrations, then exits. ingestion/api wait for
  # this to complete successfully before starting (see depends_on below) so
  # they never race against a not-yet-migrated database.
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  ingestion:
    build: .
    command: python -m service.ingestion.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No Docker healthcheck here (deliberate, not an oversight): unlike
    # `api`, this process exposes no HTTP endpoint to probe, so there's
    # nothing meaningful for `docker compose ps`/`--wait` to check beyond
    # "the process didn't crash" — which `restart: unless-stopped` already
    # covers. Real liveness monitoring (e.g. "no new bars in N minutes
    # during market hours") is explicitly Task 11's job, deferred as
    # lowest-priority in PLAN.md. In the meantime: `docker compose logs -f
    # ingestion`, or query `/metadata` on the API for each ticker's latest
    # observed bar timestamp.
    # mem_limit: 512m
    # cpus: 1.0

  api:
    build: .
    command: uvicorn service.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Plain stdlib call, not curl — avoids adding curl to the shared
      # image (Dockerfile) just for this. Hits the real /health endpoint
      # and checks its body, not just that *a* response came back:
      # /health always returns HTTP 200 even when the DB is unreachable
      # (status: "degraded" in the body — see service/api/main.py), so a
      # plain "did the request succeed" check would report healthy right
      # through a DB outage. This fails the healthcheck in that case too.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import json,sys,urllib.request as u; d=json.load(u.urlopen('http://localhost:8000/health', timeout=3)); sys.exit(0 if d.get('status')=='ok' else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # mem_limit: 512m
    # cpus: 1.0

  # On-demand: backfills ~6 weeks of historical 1m candles for all tracked
  # contracts + underlyings (Task 5). Idempotent — safe to run repeatedly,
  # e.g. after downtime, without duplicating data. NOT started by default
  # `docker compose up` (see `profiles` below) since it's a one-off/
  # periodic job, not a continuously-running service — run it explicitly:
  #   docker compose run --rm backfill
  # Note: you normally do NOT need to run this by hand anymore — the
  # `scheduler` service above runs exactly this command on a daily after-hours
  # schedule, because NDX/VIX have no live quote feed and depend on it
  # entirely. This manual path remains for ad-hoc catch-up.
  # On-demand: incremental by default (resumes from each contract/ticker's
  # latest existing bar — see PLAN.md Section 7) — use `--full` for an
  # occasional deep re-scan. `--report` writes a diagnostic summary (per-
  # underlying request timing/stop-reason, any option contract that failed
  # or hit a truncation warning) to ./backfill_reports/ on the host — see
  # PLAN.md Section 7 for why this exists (troubleshooting used to require
  # pasting a huge raw console log). Check ./backfill_reports/*.md after a
  # run.
  backfill:
    build: .
    command: python -m service.ingestion.backfill --report
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./backfill_reports:/app/backfill_reports
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["backfill"]

  # On-demand: computes Greeks (via Black-Scholes) for option_bars_1m rows
  # that don't have any yet — backfilled rows (Task 5, which never writes
  # Greeks) and any Task 4 live-ingestion gaps. Idempotent in the sense
  # that already-computed/live rows are never touched (only
  # greeks_source IS NULL rows are considered). NOT started by default
  # `docker compose up` (see `profiles`) — run it explicitly, typically
  # after a `backfill` run:
  #   docker compose run --rm greeks-backfill
  #
  # NOTE on passing flags: `docker compose run <svc> <args...>` REPLACES
  # this command with <args...>, it does not append to it. So
  # `--max-rows 5000` on its own fails with
  # `exec: "--max-rows": executable file not found`. Repeat the full
  # command instead:
  #   docker compose run --rm greeks-backfill \
  #     python -m service.greeks.backfill_job --max-rows 5000
  greeks-backfill:
    build: .
    command: ["python", "-m", "service.greeks.backfill_job"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["greeks-backfill"]

  # Long-running scheduler: fires the daily `backfill` (plus the Greeks pass)
  # on a fixed weekday after-hours schedule, so it doesn't have to be run by
  # hand. This is a hard dependency, not a nicety — TastyTrade publishes live
  # quotes for SPX but NOT for NDX or VIX (verified against the live feed
  # 2026-09-30; see PLAN.md Section 7 "NDX and VIX have no live Quote feed"),
  # so for those two tickers the candle-API backfill is their ONLY data
  # source. Without this service, NDX/VIX silently go dark on any day the
  # backfill isn't run — which is exactly what happened on 2026-09-30.
  #
  # Unlike `backfill`/`greeks-backfill`/`gap-reconcile` below, this one is NOT
  # profile-gated: it's part of the normal running stack, because the whole
  # point is that it keeps running unattended. To opt out, either drop this
  # service or set SCHEDULER_ENABLED=false in .env.
  #
  # Schedule (all overridable in .env — see service/config/settings.py):
  #   SCHEDULER_RUN_TIME=16:30        HH:MM America/New_York, weekdays only
  #   SCHEDULER_RUN_ON_STARTUP=true   also run once at boot, to catch up a
  #                                   slot missed while the container was down
  #   SCHEDULER_RUN_GREEKS=true       run the Greeks pass after the candles
  #                                   (Task 5's backfill never writes Greeks,
  #                                   so without this, daily-backfilled option
  #                                   bars land with NULL Greeks)
  #   SCHEDULER_RUN_GAP_RECONCILE=false  also do the slow full gap rescan
  # Reports land in ./backfill_reports/ on the host, same as a manual run.
  # Watch it with: docker compose logs -f scheduler
  scheduler:
    build: .
    command: python -m service.ingestion.scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./backfill_reports:/app/backfill_reports
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Unlike the one-shot job services, this one must come back on its own if
    # it dies — a dead scheduler is invisible until you notice missing bars.
    restart: unless-stopped
    # No healthcheck: this process exposes nothing to probe, and a
    # "did the last run succeed" check isn't meaningfully expressible as a
    # container health state (a run can legitimately take hours). Run history
    # and failures are in `docker compose logs scheduler`.
    # mem_limit: 512m
    # cpus: 1.0

  # Near-real-time underlying poller (see service/ingestion/live_underlying.py).
  # TastyTrade's DXFeed has NO live Quote feed for VIX/NDX (only SPX), so those
  # two used to get their 1m bars only from the once-a-day after-hours backfill.
  # This service instead builds their newest bars every minute during the
  # session and writes them to underlying_bars_1m, so VIX/NDX are available
  # intraday for the strategy monitors below (and any other consumer).
  #
  # Rows are a narrow slice of the backfill, NOT `backfill` run on a 1m timer:
  # only the two underlyings, same idempotent write path, so rows are identical
  # in shape to backfilled ones. The daily backfill still owns full history +
  # option contracts.
  #
  # Startup catch-up: the default `trade` source is live-only, so a mid-session
  # restart would otherwise leave a permanent morning hole (this happened on
  # 2026-10-13 - a 17:01 UTC restart left NDX with no bars before 16:46 UTC).
  # On boot the poller replays the gap from the Candle feed once per ticker
  # before the live loop; skip with --no-catch-up.
  #
  # Tune via env: LIVE_UNDERLYING_TICKERS (default "VIX,NDX"),
  # LIVE_UNDERLYING_CATCH_UP_HOURS (default 8, the max lookback the catch-up
  # will replay), and flags --interval/--lookback-min/--window-start/
  # --window-end (defaults: 60s / 4min / 13:25 / 20:20 UTC, weekdays only).
  underlying-live:
    build: .
    command: python -m service.ingestion.live_underlying
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # mem_limit: 256m
    # cpus: 0.5

  # Near-real-time option-candle poller (see service/ingestion/live_options.py).
  # SPX option quotes/bars stream live into `ingestion`, but NDX option 1m
  # candles only existed after the once-a-day backfill (16:30 ET). This service
  # pulls just the last few minutes of candles for the day's 0DTE contracts
  # every minute during the session and writes them to option_bars_1m, so NDX
  # 0DTE option bars — with IV, needed for the 0DTE strategy monitor below —
  # exist intraday, exactly as the history they're compared against does.
  #
  # Same narrow-slice philosophy as underlying-live: reuses the backfill's own
  # candidate resolution + idempotent per-contract write path, restricted to
  # today's expiration and to the polled ticker(s), so rows are byte-identical
  # in shape to backfilled ones. The daily backfill still owns full history +
  # Greeks reconciliation.
  #
  # Tune via env: LIVE_OPTIONS_TICKERS (default "NDX"), and flags
  # --interval/--lookback-min/--window-start/--window-end/--concurrency
  # (defaults: 60s / 6min / 13:20 / 20:20 UTC / 8, weekdays only).
  options-live:
    build: .
    command: python -m service.ingestion.live_options
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # mem_limit: 256m
    # cpus: 0.5

  # above (which is now incremental-by-default — see PLAN.md Section 9/the
  # underlying-backfill bug entry in Section 7 — so it no longer re-scans
  # everything on every run). This one does re-scan everything in the
  # lookback window specifically to find and fill real gaps (missing
  # minutes for a continuously-quoted underlying), not just catch up since
  # the last known bar — slower, so it's off in the daily `scheduler`
  # schedule by default. Two ways to run it on a cadence:
  #   1. Set SCHEDULER_RUN_GAP_RECONCILE=true in .env (uses the in-container
  #      scheduler — preferred, no host cron needed).
  #   2. Host cron/systemd timer, e.g.:
  #        0 6 * * * cd /path/to/options-service && docker compose run --rm gap-reconcile
  # Check what it found/fixed via `GET /gaps` (service/api/routes.py) or
  # ./backfill_reports/*.md on the host (see the `backfill` service's own
  # comment above — same --report mechanism, same mount).
  gap-reconcile:
    build: .
    command: python -m service.ingestion.backfill --reconcile-underlying-gaps --report
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-options_user}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-options_data}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./backfill_reports:/app/backfill_reports
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["gap-reconcile"]

volumes:
  timescale_data:
